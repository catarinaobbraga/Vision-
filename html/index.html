<!DOCTYPE html> <!--aviso o navegador a linguagem-->
<html lang="pt-br"> <!--idioma-->
<head> <!--Cabeçalho de configuração-->
    <meta charset="UTF-8"> <!--configura a codificação de caracteres-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIGDATA</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <!--Tags de texto-->
    <h1>Título</h1>
    <h2>Subtitulo</h2>
    <h3>terceiro nivel</h3> <!--e por assim vai, cada "h" é basicamente a identidade daquele texto, e cada texto diferente vai mudando-->
    <p>parágrafo</p>

    <!--Tags multimidia-->
    <video></video> <!--usa para colocar video-->
    <img src="https://i.pinimg.com/736x/c8/00/15/c800150e2deb64d87a02da46c4f63d35.jpg" alt="descrição de imagem"> <!--o "src" é resposável pelo arquivo, e o "alt" é responsável pela descrição da imagem (quando a gente coloca o mouse em cima eu acho)-->
    <audio></audio>

    <!--tags de incorporação-->
    <iframe src=""></iframe> <!--incorpora dentro do site (tipo quando a gente vai em um site, e tem um video do youtube mesmo sem estar dentro do site do youtube)-->

    <!--tag de link-->
    <a href="https://www.youtube.com/">link</a> <!--linka um site-->
    <a href="pagina.html">outra pagina</a> <!--linka um site-->

    <!--Tag de botão-->
    <button>botão</button>

    <!--tag de cabeçalho e rodapé-->
    <header>cabeçalho</header>
    <footer>rodapé</footer>

    <!--tag de seção-->
    <section>seção</section>
    
    <!--tag de div-->
    <div>divisão de conteúdo</div>

    <!--"id" serve para indentificar os "h" no css, caso tenha repetido algum h, no css deve ser indentificado por #-->
    <!--"class" indentificado por "."-->




































</body>
</html>
