<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Facial - Vision+</title>
    <link rel="icon" type="image/png" href="imagens/logo.png">
    <link rel="stylesheet" href="face2.css">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
</head>
<body class="body-face">

    <main class="pagina-face">
        <section class="face-container">
            <img src="imagens/logo.png" alt="Vision+" class="logo-face">
            <h1>Login com reconhecimento facial</h1>
            <p class="face-text">
                Posicione seu rosto dentro da moldura para cadastrar ou fazer login com segurança.
            </p>
            <div class="camera-box">
                <video id="videoFace" autoplay muted playsinline></video>
                <canvas id="canvasFace"></canvas>
                <div class="moldura-rosto"></div>
            </div>
            <div id="statusFace" class="status-face">
                Aguardando reconhecimento...
            </div>
            
            <div class="botoes-face">
                <button id="btnIniciarCamera" class="btn-face btn-primary">
                    🤳Iniciar Câmera</button>
                <button id="btnCadastrarFace" class="btn-face btn-sucecss" style="display: none;">
                    🥸Cadastrar Rosto</button>
                <button id="btnEntrarFace" class="btn-face btn-info" style="display: none;">
                    🔐 Entrar com Rosto</button>
            </div>

            <div class="term-face" id="termofacewrap" style="display: none;">
                <labe>
                    <input type="checkbox" id="aceitoTermoFace">
                    Aceito os termos para cadastro facial
                </labe>
            </div>

            <a href ="login.html" class="voltar-login">
                ← Voltar para o login
            </a>
        </section>
    </main>

    <script type="module" src="js/face-auth.js">
    </script>

</body>
</html>
